<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6114"/>
    </radialGradient>
    <radialGradient id="maroonBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#541219"/>
      <stop offset="85%" stop-color="#24070a"/>
      <stop offset="100%" stop-color="#140204"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Outer Gold Border with Lotus Petals -->
  <circle cx="100" cy="100" r="96" fill="url(#goldGlow)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="90" fill="url(#maroonBg)"/>
  
  <!-- Decorative Ring -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#e6c66e" stroke-width="1.5"/>
  
  <!-- Trishula & Sacred Symbols -->
  <g transform="translate(100, 100) scale(0.9)">
    <!-- Trishul Shaft -->
    <rect x="-3" y="-35" width="6" height="85" rx="3" fill="url(#goldGlow)"/>
    <!-- Trishul Center Prong -->
    <path d="M0,-65 C-6,-50 -6,-35 0,-35 C6,-35 6,-50 0,-65 Z" fill="url(#goldGlow)"/>
    <!-- Trishul Left Prong -->
    <path d="M-4,-35 C-22,-35 -30,-58 -22,-60 C-18,-62 -14,-45 -4,-40 Z" fill="url(#goldGlow)"/>
    <!-- Trishul Right Prong -->
    <path d="M4,-35 C22,-35 30,-58 22,-60 C18,-62 14,-45 4,-40 Z" fill="url(#goldGlow)"/>
    <!-- Damaru Center -->
    <path d="M-14,-15 L14,-3 L-14,-3 L14,-15 Z" fill="#f8e4a0"/>
    <circle cx="0" cy="-9" r="3" fill="#8a6114"/>
    <!-- Sacred Om / Aura -->
    <circle cx="0" cy="12" r="24" fill="rgba(212,175,55,0.15)" stroke="#d4af37" stroke-width="1"/>
    <text x="0" y="21" font-family="'Georgia', serif" font-size="28" font-weight="bold" fill="#fff5cc" text-anchor="middle">ॐ</text>
  </g>
</svg>